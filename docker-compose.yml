name: chailedger

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chailedger:local
    container_name: chailedger-app
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      CHAILEDGER_DATABASE: /app/data/chailedger.db
      CHAILEDGER_RATE_PER_KG: ${CHAILEDGER_RATE_PER_KG:-25}
      CHAILEDGER_MAX_KG_PER_DELIVERY: ${CHAILEDGER_MAX_KG_PER_DELIVERY:-150}
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - chailedger-data:/app/data
    networks:
      - chailedger-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: chailedger:local
    profiles: ["seed"]
    command: ["flask", "--app", "run", "seed"]
    environment:
      CHAILEDGER_DATABASE: /app/data/chailedger.db
    volumes:
      - chailedger-data:/app/data
    networks:
      - chailedger-net
    restart: "no"
    depends_on:
      app:
        condition: service_healthy

volumes:
  chailedger-data:
    name: chailedger-data

networks:
  chailedger-net:
    name: chailedger-net
    driver: bridge
