services:
  app:
    image: ${ACR_LOGIN_SERVER}/chailedger:${IMAGE_TAG}
    container_name: chailedger-app
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      CHAILEDGER_DATABASE: /app/data/chailedger.db
      CHAILEDGER_RATE_PER_KG: ${CHAILEDGER_RATE_PER_KG:-25}
      CHAILEDGER_MAX_KG_PER_DELIVERY: ${CHAILEDGER_MAX_KG_PER_DELIVERY:-150}
    ports:
      - "5000:5000"
    volumes:
      - chailedger-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/readiness', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  chailedger-data:
    name: chailedger-data
